[test]
# Skip compiled output. The test scripts pass src.
exclude = ["dist/**", "node_modules/**"]
# Coverage: use Bun's built-in so all tests (including route tests using bun:sqlite) run
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Optional: set to fail the run below this line coverage. Targets: Coverage in the root README.md.
# coverageThreshold = 50
coveragePathIgnorePatterns = ["node_modules", "src/__tests__", "src/**/*.d.ts", "src/**/*.config.*", "dist"]
