name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches the oven/bun:1 images in the Dockerfile.
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck, lint, build, unit tests, and the docs stale-claims check.
      - name: Verify
        run: bun run ci:verify
