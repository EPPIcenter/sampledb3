name: Prune untagged GHCR versions
description: >
  Deletes older untagged container package versions via the GitHub API (gh + bash).
  Same role as actions/delete-package-versions for untagged-only cleanup, without a Node runtime.

inputs:
  owner:
    description: Package owner (organization login or username)
    required: true
  package-name:
    description: Container package name (often the repository name)
    required: true
  min-versions-to-keep:
    description: How many newest untagged versions to keep
    required: false
    default: "5"
  dry-run:
    description: If "true", print IDs that would be deleted without calling DELETE
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${GITHUB_ACTION_PATH}/prune.sh"
      env:
        OWNER: ${{ inputs.owner }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        MIN_KEEP: ${{ inputs.min-versions-to-keep }}
        DRY_RUN: ${{ inputs.dry-run }}
