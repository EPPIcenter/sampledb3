# fly.toml app configuration file generated for demo-sampledb on 2026-02-12T09:06:21-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'demo-sampledb'
primary_region = 'jnb'

[build]

[env]
  ALLOWED_ORIGINS = 'https://sampledb.fly.dev'
  DATABASE_PATH = '/data/sampledb.sqlite'
  ERROR_LOG_ENABLED = 'true'
  ERROR_LOG_LEVEL = 'error'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'sampledb_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
